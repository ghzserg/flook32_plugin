#####################################################################
#                   FLOOK32 Sensor for Klipper                      #
#####################################################################
#                                                                    
#                   DO NOT EDIT THIS FILE
#    COPY THE PARAMETERS YOU NEED INTO mod_data/user.cfg
#                                                                    
#   Connecting the FLOOK32 chamber heater controller                 
#                                                                    
#                   DO NOT EDIT THIS FILE
#                                                                    
#    COPY THE PARAMETERS YOU NEED INTO mod_data/user.cfg
#                                                            
#   📌 IMPORTANT: ALL PARAMETERS BELOW ARE OPTIONAL                  
#   The plugin sends to ESP32 ONLY those parameters that you         
#   explicitly specify in the config. The rest remain as on the device.
#                                                                    
#   ═══════════════════════════════════════════════════════════════ 
#                                                                    
#   # ========== MODULE FIRST (required, even if empty) ==========
[flook32]

# ========== THEN SENSOR ==========
[temperature_sensor chamber]
sensor_type: flook32
                                                                                                                              
#   ═══════════════════════════════════════════════════════════════ 
#                                                                    
#   🔧 FULL LIST OF PARAMETERS:                                    
#   -----------------------------------------------------------------
#                                                                    
#   === BASIC SETTINGS ===                                        
#   -----------------------------------------------------------------
#   sensor_type: flook32           # sensor type (required)              
#   flook_ip: 192.168.1.37         # IP address (optional)          
#   flook_port: 80                 # HTTP/WebSocket port             
#   auto_discover: True            # auto-discovery via UDP (default True)
#   report_interval: 10.0          # ⚠️ HTTP MODE ONLY ⚠️    
#                                  # HTTP polling interval (sec)
#                                  # Range: 5-60 sec, default 10 sec
#                                  # Does NOT affect WebSocket!
#   silent: False                  # Silent mode                    
#                                  # True  - do NOT output messages to console
#                                  # False - output all messages to console
#
#   === ERROR AUTO-NOTIFICATION SETTINGS ===                     
#   -----------------------------------------------------------------
#   enable_error_notifications: True   # Enable error auto-notifications
#   error_notification_max_age: 600    # Maximum error age (sec)
#   error_check_interval: 30           # How often to check API (sec)
#   show_trends: True                  # Show error trends
#   max_trend_lines: 30                # Maximum number of trend lines
#                                                                    
#   === HEATER SETTINGS ===                                    
#   -----------------------------------------------------------------
#   max_heater_temp: 100.0         # max. heater temperature (°C)
#   critical_temp: 110.0           # critical temperature (°C)    
#   critical_hysteresis: 5.0       # alarm clear hysteresis (°C)   
#   max_air_temp: 70.0             # max. air temperature (°C)  
#   air_hysteresis: 3.0            # air overheat hysteresis (°C)
#   hysteresis: 0.5                # heating activation hysteresis (°C)
#   heater_hysteresis: 4.0         # heater hysteresis (°C)     
#   enable_heater_hysteresis: True # enable heater control
#   default_target_temp: 0         # default target temperature
#   invert_heater_signal: False    # invert SSR signal        
#   max_fan_duty: 1023             # max. fan power (0-1023)
#   settings_locked: True          # lock settings
#                                                                    
#   === FAN SETTINGS ===                                    
#   -----------------------------------------------------------------
#   fan_on_temp: 55.0              # fan turn-on temperature
#   fan_off_hysteresis: 3.0        # turn-off hysteresis (°C)      
#   fan_min_on_time: 30            # min. operating time (sec)         
#   invert_fan_signal: False       # invert fan signal
#   fan_efficiency_timeout: 120    # efficiency check timeout (sec)
#   fan_efficiency_threshold: 2.0  # efficiency threshold (°C)        
#   enable_fan_efficiency_check: True # fan efficiency check
#   enable_fan_auto_limit: False   # automatic fan power limiting
#   fan_auto_limit_hysteresis: 3.0 # auto-limit hysteresis (°C)
#   fan_auto_limit_adjust_step: 10 # duty adjustment step
#   fan_auto_limit_min_duty: 400   # minimum duty
#   fan_auto_limit_check_interval: 5000  # check interval (ms)
#   fan_auto_limit_stable_count: 3 # measurements for stabilization
#                                                                    
#   === THERMAL RUNAWAY PROTECTION (FOUR-PHASE) ===                   
#   -----------------------------------------------------------------
#   enable_thermal_runaway: True   # enable runaway protection         
#   runaway_quick_check_temp: 60.0 # Phase 0: min. temperature after 45 sec (°C)
#   runaway_phase1_time: 5         # phase 1 time (min)              
#   runaway_phase2_time: 15        # phase 2 time (min)              
#   runaway_max_time_to_target: 30 # max. time to target (min)       
#   runaway_min_heater_rise: 2.0   # min. heater rise (°C/min)
#   runaway_min_air_rise: 0.5      # min. air rise (°C/min)    
#   runaway_max_heater_drop: 15.0  # max. heater drop (°C)  
#   runaway_hysteresis: 2.0        # runaway hysteresis (°C)         
#   runaway_recovery_timeout: 30   # recovery timeout (sec)    
#   runaway_fan_on: False          # turn fan on during runaway 
#                                                                    
#   === UNEXPECTED HEATING PROTECTION ===                           
#   -----------------------------------------------------------------
#   enable_unexpected_heat: True   # enable protection                 
#   unexpected_heat_timeout: 45    # timeout (sec)                   
#   unexpected_heat_threshold: 15  # heating threshold (°C)              
#   min_cooling_rate: 1.0          # min. cooling rate (°C/sec)
#   unexpected_heat_hysteresis: 3.0 # hysteresis (°C)                
#   unexpected_heat_clear_time: 30000 # clear time (ms)             
#   unexpected_heat_safe_offset: 10 # safe offset (°C)         
#   enable_unexpected_heat_adaptive: False # adaptive threshold        
#   adaptive_base_temp: 20.0       # base temperature (°C)        
#   adaptive_coefficient: 0.3      # adaptation coefficient           
#   adaptive_min_offset: 30.0      # min. adaptive offset (°C)     
#                                                                    
#   === RATE OF RISE CONTROL ===                                   
#   -----------------------------------------------------------------
#   enable_abnormal_rate: True     # enable control               
#   abnormal_rate_threshold: 5.0   # abnormal rate threshold (°C/sec)
#                                                                    
#   === MAX6675 PARAMETERS ===                                        
#   -----------------------------------------------------------------
#   max6675_offset: 0.0            # calibration offset (°C)          
#   enable_max6675_protection: True # sensor protection                 
#   max6675_stability_samples: 3   # samples for stability        
#   max6675_temp_jump_threshold: 20 # temperature jump threshold (°C)  
#   max6675_min_temp: -50.0        # min. temperature (°C)           
#   max6675_max_temp: 400.0        # max. temperature (°C)          
#                                                                    
#   === DS18B20 PARAMETERS ===                                        
#   -----------------------------------------------------------------
#   ds18b20_offset: 0.0            # calibration offset (°C)          
#   ds18b20_scale: 1.0             # scale (coefficient)           
#   ds18b20_cal_enabled: False     # enable calibration             
#   enable_air_sensor_protection: True # air sensor protection      
#   air_sensor_stability_samples: 5 # samples for stability       
#   air_sensor_temp_jump_threshold: 2.0 # jump threshold (°C)          
#   air_sensor_min_temp: -40.0     # min. temperature (°C)           
#   air_sensor_max_temp: 125.0     # max. temperature (°C)          
#   air_sensor_unstable_range: 3.0 # instability range (°C)    
#   air_sensor_unstable_deviation: 1.5 # deviation (°C)             
#   air_sensor_unstable_window: 10 # instability window (measurements)
#   air_sensor_direction_changes: 3 # direction changes              
#                                                                    
#   === ERRORS AND LOCKS ===                                       
#   -----------------------------------------------------------------
#   max_error_retries: 3           # max. error retries           
#   error_window_minutes: 10       # error counting window (min)  
#   min_time_between_same_errors: 30000 # min. time between same errors (ms)
#   min_time_between_overheat_counts: 5000 # min. time between overheat counts (ms)
#   unlock_password: unlock        # unlock password        
#                                                                    
#   === LED INDICATION ===                                            
#   -----------------------------------------------------------------
#   led_enabled: True              # enable LED                    
#   led_count: 3                   # number of LEDs          
#   led_brightness: 50             # brightness (0-255)                 
#   led_pin: 27                    # LED pin                         
#                                                                    
#   === HEARTBEAT ===                                                 
#   -----------------------------------------------------------------
#   heartbeat_pulse_ms: 100        # pulse duration (ms)      
#   heartbeat_pause_ms: 900        # pause between pulses (ms)     
#                                                                    
#   === INTERVALS ===                                                 
#   -----------------------------------------------------------------
#   read_interval: 1000            # read interval (ms)            
#   control_interval: 3000         # control interval (ms)        
#   trend_interval: 5000           # trend interval (ms)           
#   heap_check_interval: 30000     # heap check (ms)              
#   loop_watchdog_timeout: 30000   # watchdog timeout (ms)           
#   enable_loop_watchdog: True     # enable watchdog
#   udp_discovery_timeout: 30000   # UDP discovery timeout (ms)         
#   discovery_retry_interval: 1000 # discovery retry interval (ms)    
#   heater_control_interval: 200   # heater control interval (ms)
#   fan_control_interval: 1000     # fan control interval (ms)
#   runaway_check_interval: 5000   # runaway check interval (ms)  
#   unexpected_check_interval: 2000 # unexpected heat check interval (ms)
#   rate_check_interval: 1000      # rate check interval (ms) 
#                                                                    
#   === AUTO-SHUTDOWN VIA MOONRAKER ===                             
#   -----------------------------------------------------------------
#   auto_shutdown_enabled: False   # automatically turn off heating after N minutes
#                                  # AFTER PRINT COMPLETION
#   auto_shutdown_minutes: 30      # waiting time after print completion (min)
#   
#   📊 HOW IT WORKS:
#   - FLOOK32 polls Moonraker every 60 seconds
#   - On transition "printing" → "standby/complete" starts timer
#   - After auto_shutdown_minutes minutes turns off heating
#   - On new print start timer resets
#   - Klipper IP is saved in NVS and restored after reboot
#   - Moonraker status is displayed in web interface
#   
#   ⚠️ Moonraker must be available on port 7125
#                                                                    
#   === THERMAL MODEL ===                                         
#   -----------------------------------------------------------------
#   enable_thermal_model: False    # enable thermal model      
#   thermal_model_sensitivity: 1.0 # model sensitivity         
#   thermal_model_check_interval: 2000 # check interval (ms)      
#   thermal_model_log_warnings: True # log warnings     
#                                                                    
#   === PINS ===                                                     
#   -----------------------------------------------------------------
#   pin_ssr: 32                     # SSR pin (heater)           
#   pin_fan: 33                     # fan pin                 
#   pin_watchdog: 26                # watchdog pin                    
#   pin_onewire: 21                 # OneWire pin (DS18B20)           
#   pin_max_sck: 18                 # SCK pin (MAX6675)               
#   pin_max_so: 19                  # SO pin (MAX6675)                
#   pin_max_cs: 5                   # CS pin (MAX6675)                
#   pin_buzzer: 25                  # buzzer pin                     
#   pin_led: 27                     # LED pin                         
#                                                                    
#   === BUZZER ===
#   -----------------------------------------------------------------
#   buzzer_enabled: True            # enable buzzer
#   buzzer_non_critical_enabled: False # signal on non-critical errors
#   buzzer_melody: 1                # melody (0=short, 1=double, 2=alarm)
#                                                                    
#   ═══════════════════════════════════════════════════════════════ 
#                                                                    
#   🖥️ GCODE COMMANDS:                                               
#   -----------------------------------------------------------------
#                                                                    
#   BASIC:
#   FLOOK_STATUS                 - show device status       
#   FLOOK_TEMP                   - show current temperature     
#   FLOOK_SET S=55               - set target temperature   
#   FLOOK_OFF                    - turn off heating                 
#   FLOOK_DISCOVER               - force device discovery on network
#   FLOOK_SET_IP IP=192.168.1.37 - set IP manually           
#                                                                    
#   CONTROL:
#   FLOOK_UNLOCK [PASSWORD=xxx]  - unlock settings         
#   FLOOK_LOCK                   - lock settings          
#   FLOOK_REBOOT                 - reboot ESP32               
#   FLOOK_RESET_ID               - reset saved ID and start rediscovery
#                                                                    
#   CONFIGURATION:
#   FLOOK_CONFIG_GET             - show current configuration    
#   FLOOK_AUTO_SHUTDOWN [ENABLE=1] [MINUTES=30] - auto-shutdown control
#   FLOOK_AUTO_SHUTDOWN_STATUS   - auto-shutdown status            
#                                                                    
#   DIAGNOSTICS:
#   FLOOK_ERRORS                 - show error log            
#   FLOOK_CALIBRATE TEMP=100     - calibrate MAX6675 against reference
#                                                                    
#   ADAPTATION:
#   FLOOK_ADAPT_START TARGET=60  - start adaptation                 
#   FLOOK_ADAPT_ABORT            - abort adaptation                 
#   FLOOK_ADAPT_STATUS           - adaptation status                 
#                                                                    
#   ═══════════════════════════════════════════════════════════════ 
#                                                                    
#   🎛️ SLICER INTEGRATION (M141 / M191):                        
#   -----------------------------------------------------------------
#                                                                    
#   [gcode_macro M141]
#   gcode:
#       {% set S = params.S|default(0)|float %}
#       FLOOK_SET S={S}
#                                                                    
#   [gcode_macro M191]
#   gcode:
#       {% set S = params.S|default(0)|float %}
#       FLOOK_SET S={S}
#       {% if S > 0 %}
#           TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={S-2} MAXIMUM={S+2}
#       {% endif %}
#   -----------------------------------------------------------------
#                                                                    
#   📌 To integrate into START_PRINT / END_PRINT use:
#   M141 S{CHAMBER}  — set temperature from slicer
#   M141 S0          — turn off heating at end of print
#                                                                    
#   ═══════════════════════════════════════════════════════════════ 
#                                                                    
#   🔌 PLUGIN OPERATION FEATURES:                                                 
#   -----------------------------------------------------------------
#                                                                    
#   ✅ UDP discovery with ID confirmation
#      - Plugin sends broadcast with device ID (if saved)
#      - FLOOK32 responds TRUE/FALSE depending on ID match
#      - On first launch without ID, device with lowest uptime is selected
#      - ID is saved in Moonraker DB or ~/.flook32_id
#      - On subsequent launches connects ONLY to device with saved ID
#      - To reset ID: FLOOK_RESET_ID
#
#   ✅ WebSocket support (real time)                          
#      - With websocket-client installed, data comes in real time
#      - If WebSocket is unavailable, automatic fallback to HTTP    
#
#   ✅ Saving Klipper IP on FLOOK32 side
#      - Klipper IP is saved in NVS on TRUE response to UDP discovery
#      - Restored after FLOOK32 reboot
#      - For manual mode: plugin sends one UDP request on first connection
#
#   ✅ Auto-shutdown via Moonraker
#      - Works directly via HTTP, does not require plugin
#      - Status is displayed in web interface
#      - Klipper IP is not lost when FLOOK32 reboots
#
#   ✅ Behavior on connection loss                                    
#      - Manual mode: keeps polling the specified IP          
#      - Automatic mode: UDP loop reconnects             
#                                                                    
#   ═══════════════════════════════════════════════════════════════ 
#                                                                    
#   🔍 TROUBLESHOOTING:                                          
#   -----------------------------------------------------------------
#                                                                    
#   PROBLEM: No connection to FLOOK32
#   Solution: FLOOK_DISCOVER or FLOOK_RESET_ID
#                                                                    
#   PROBLEM: Auto-shutdown does not work
#   Check: Moonraker status in web interface ("🌙 Moonraker not connected")
#   Solution: Check that Moonraker is running on port 7125
#                                                                    
#   PROBLEM: Plugin connects to someone else's FLOOK32
#   Solution: FLOOK_RESET_ID
#                                                                    
#   ═══════════════════════════════════════════════════════════════